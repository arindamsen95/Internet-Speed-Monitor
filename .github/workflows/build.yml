name: Build Internet Speed Monitor

on:
  push:
  pull_request:

jobs:
  build:
    name: Build on Ubuntu Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-22.04]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libglib2.0-dev \
            libglib2.0-dev-bin \
            pkg-config \
            zip

      - name: Check required tools
        run: |
          gcc --version
          g++ --version
          make --version
          pkg-config --version
          dpkg -s libglib2.0-bin | grep Version

      - name: Clean and Build Application
        run: |
          make clean
          make -j$(nproc)

      - name: Verify Executable Creation
        run: |
          test -f internet-speed
          # Use timeout (2 seconds) so a non-exiting D-Bus daemon doesn't block CI
          timeout 2s ./internet-speed || [ $? -eq 124 ]

      - name: Check generated D-Bus files
        run: |
          test -f src/NetworkSpeedDBus.c
          test -f src/NetworkSpeedDBus.h

      - name: Bundle GNOME Extension ZIP
        run: |
          cd extension
          zip -r ../internet-speed@arindamsen95.zip .
          cd ..
          test -f internet-speed@arindamsen95.zip
  
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: internet-speed-ubuntu-${{ matrix.os }}
          path: |
            internet-speed
            internet-speed@arindamsen95.zip
