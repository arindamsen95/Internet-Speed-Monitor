name: Build Internet Speed Monitor

on:
  push:
  pull_request:

jobs:
  build:
    name: Build on Ubuntu Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          # 1. Purge needrestart to prevent hanging on Ubuntu 24.04 / 26.04
          sudo apt-get remove -y needrestart || true

          # 2. Mask systemd services that block headless containers
          sudo mkdir -p /etc/systemd/system/
          sudo ln -sf /dev/null /etc/systemd/system/systemd-oomd.service

          # 3. Install build tools without interactive prompts
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            libglib2.0-dev \
            libglib2.0-dev-bin \
            pkg-config \
            zip \
            gjs \
            gnome-shell-common \
            node-eslint \
            nodejs
            
      - name: Check required tools
        run: |
          gcc --version
          g++ --version
          make --version
          pkg-config --version
          dpkg -s libglib2.0-bin | grep Version

      - name: Clean and Build Application
        run: |
          make clean
          make -j$(nproc)

      - name: Verify Executable Creation
        run: |
          test -f internet-speed
          # Use timeout (2 seconds) so a non-exiting D-Bus daemon doesn't block CI
          timeout 2s ./internet-speed || [ $? -eq 124 ]

      - name: Check generated D-Bus files
        run: |
          test -f src/NetworkSpeedDBus.c
          test -f src/NetworkSpeedDBus.h

      - name: Run D-Bus Integration Tests
        run: |
          chmod +x tests/test-dbus.sh
          ./tests/test-dbus.sh

      - name: Run GNOME Extension Tests
        run: |
          chmod +x tests/test-extension.sh
          ./tests/test-extension.sh

      - name: Validate GNOME Extension Metadata
        run: |
          python3 -m json.tool extension/metadata.json > /dev/null
          test "$(python3 -c "import json; print(json.load(open('extension/metadata.json'))['uuid'])")" = "internet-speed@arindamsen95"

      - name: Bundle GNOME Extension ZIP
        run: |
          cd extension
          zip -r ../internet-speed@arindamsen95.zip .
          cd ..
          test -f internet-speed@arindamsen95.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: internet-speed-ubuntu-${{ matrix.os }}
          path: |
            internet-speed
            internet-speed@arindamsen95.zip
